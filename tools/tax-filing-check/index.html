<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="給与収入と副業の所得を入れると、確定申告が必要かどうかの目安が分かります。">
<link rel="canonical" href="https://pyt4267.github.io/tools/tax-filing-check/">
<title>確定申告が必要か診断（給与所得者・副業） ｜ AI時短ラボ</title>
<style>
:root{--bg:#080D16;--fg:#E8EEF8;--mut:#94A3B8;--acc:#2BE3A4;--line:#1F2A3A}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
main{max-width:720px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:23px;margin:0 0 8px}
.lead{color:var(--mut);margin:0 0 20px}
label{display:block;font-size:14px;margin:0 0 6px;color:#CBD5E1}
input{width:100%;box-sizing:border-box;background:#0E1626;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin:0 0 14px}
button{background:var(--acc);color:#06251A;font-weight:800;border:0;border-radius:10px;padding:13px 18px;font-size:16px;width:100%}
#out{display:none;margin:22px 0 0;border:1px solid var(--line);border-radius:14px;padding:18px;background:rgba(18,26,42,.7)}
.verdict{font-size:20px;font-weight:800;color:var(--acc);margin:0 0 8px}
.why{color:#D6DEEA;font-size:14px;margin:0 0 10px}
.note{color:var(--mut);font-size:12.5px}
.acard{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0 0;background:rgba(18,26,42,.7)}
.at{font-weight:800;margin-bottom:6px}
.am{color:var(--mut);font-size:13.5px}
.pr{color:var(--mut);font-size:12px}
</style><meta property="og:type" content="website"><meta property="og:title" content="確定申告が必要か診断（給与所得者・副業） ｜ AI時短ラボ"><meta property="og:url" content="https://pyt4267.github.io/tools/tax-filing-check/"><meta property="og:image" content="https://pyt4267.github.io/img/og-site.png"><meta name="twitter:card" content="summary_large_image"></head><body><main>
<h1>確定申告が必要か診断</h1>
<p class="lead">給与所得者の方が、副業の所得から確定申告の要否を判断するための目安です。</p>
<label for="salary">年間の給与収入（万円）</label>
<input type="number" id="salary" inputmode="numeric" placeholder="例: 400">
<label for="side">副業の所得（収入 − 経費・万円）</label>
<input type="number" id="side" inputmode="numeric" placeholder="例: 25">
<button id="go">判定する</button>
<div id="out">
  <p class="verdict" id="verdict"></p>
  <p class="why" id="why"></p>
  <p class="note">この判定は一般的な目安です。所得の種類・控除・家族状況で変わります。
  最終的な判断は国税庁の情報と税務署の窓口でご確認ください。</p>
  <a class="acard" href="https://px.a8.net/svt/ejp?a8mat=4BGL03+A7CJCA+3SPO+9FIFPT&a8sns=instagram&sub_id=tool-tax-check" target="_blank" rel="noopener sponsored nofollow"><div class="at">確定申告は会計ソフトで済ませる（freee会計） →</div><div class="am">レシート撮影だけで自動仕訳。確定申告まで一気通貫。</div></a>
  <p class="pr">アフィリエイト広告を含みます。</p>
</div>
<footer class="SITEFOOT" style="max-width:760px;margin:44px auto 0;padding:18px 20px 40px;border-top:1px solid #1F2A3A;font-size:13px;color:#94A3B8;line-height:2"><a href="/read/" style="color:#94A3B8;text-decoration:none">記事一覧</a> ／ <a href="/steps/" style="color:#94A3B8;text-decoration:none">手順まとめ</a> ／ <a href="/tools/" style="color:#94A3B8;text-decoration:none">無料ツール</a> ／ <a href="/diagnose/" style="color:#94A3B8;text-decoration:none">診断</a> ／ <a href="/about/" style="color:#94A3B8;text-decoration:none">運営者情報</a><div style="margin-top:6px">アフィリエイト広告を含みます。</div></footer><a href="/tools/" style="display:block;margin-top:26px;color:#94A3B8;text-decoration:none;font-size:14px">← ツール一覧へ</a><a href="/read/" style="display:block;margin-top:8px;color:#94A3B8;text-decoration:none;font-size:14px">← 記事一覧へ</a></main>
<script>
document.getElementById('go').addEventListener('click', () => {
  const sal = Number(document.getElementById('salary').value || 0);
  const side = Number(document.getElementById('side').value || 0);
  if (!sal && !side) { alert('金額を入れてください'); return; }
  let v = '', why = '';
  if (sal > 2000) {
    v = '確定申告が必要です';
    why = '給与収入が2,000万円を超える場合は、年末調整の対象外となり確定申告が必要です。';
  } else if (side > 20) {
    v = '確定申告が必要です';
    why = '給与所得者でも、副業の所得が年間20万円を超えると確定申告が必要です。';
  } else if (side > 0) {
    v = '確定申告は不要の目安ですが、住民税の申告が必要です';
    why = '所得が20万円以下なら所得税の確定申告は不要ですが、住民税は申告が必要です（自治体の案内に従ってください）。';
  } else {
    v = '確定申告は不要の目安です';
    why = '副業の所得がない場合、通常は年末調整で完了します。';
  }
  document.getElementById('verdict').textContent = v;
  document.getElementById('why').textContent = why;
  document.getElementById('out').style.display = 'block';
});
</script>
</body></html>
