<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI議事録ツール診断（3問） ｜ AI時短ラボ</title>
<style>
:root{--bg:#080D16;--fg:#E8EEF8;--mut:#94A3B8;--acc:#2BE3A4;--line:#1F2A3A}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
main{max-width:720px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:23px;margin:0 0 8px}
.lead{color:var(--mut);margin:0 0 22px}
.q{margin:0 0 20px;border:1px solid var(--line);border-radius:14px;padding:16px}
.qt{font-weight:800;margin:0 0 10px}
label{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;cursor:pointer}
label:has(input:checked){border-color:var(--acc);background:rgba(43,227,164,.08)}
input{margin-right:8px}
#go{display:block;width:100%;background:var(--acc);color:#06251A;font-weight:800;border:0;border-radius:12px;padding:15px;font-size:16px;margin-top:8px}
#result{display:none;margin:24px 0 0}
#why{color:#D6DEEA;margin:0 0 14px}
.res{display:block;text-decoration:none;color:inherit;border:1.5px solid var(--acc);border-radius:14px;padding:16px;margin:0 0 12px}
.rn{font-weight:800;color:var(--acc)}
.rp{color:var(--mut);font-size:13.5px;margin:4px 0 8px}
.rc{font-weight:800;color:var(--acc)}
.pr{color:var(--mut);font-size:12px}
a.back{display:block;margin-top:30px;color:var(--mut);text-decoration:none;font-size:14px}
</style><meta property="og:type" content="website"><meta property="og:title" content="AI議事録ツール診断（3問） ｜ AI時短ラボ"><meta property="og:url" content="https://pyt4267.github.io/diagnose/recorder/"><meta property="og:image" content="https://pyt4267.github.io/img/og-site.png"><meta name="twitter:card" content="summary_large_image"></head><body><main>
<h1>AI議事録ツール診断（3問）</h1>
<p class="lead">3つの質問で、会議の文字起こしに向いている道具を判定します。</p>
<div id="form"></div>
<button id="go">診断する</button>
<div id="result"><p id="why"></p><div id="cards"><a class="res" data-cand="plaud" href="https://px.a8.net/svt/ejp?a8mat=4BGD73+AFOMKY+5J4W+5YZ76&a8sns=instagram&sub_id=diagnose-recorder" target="_blank" rel="noopener sponsored nofollow"><div class="rn">Plaud</div><div class="rp">会議の録音から文字起こし・要約まで。カード型のAIボイスレコーダー。</div><div class="rc">詳しく見る →</div></a><a class="res" data-cand="comu" href="https://px.a8.net/svt/ejp?a8mat=4BGD73+AF36Z6+5YZG+5YRHE&a8sns=instagram&sub_id=diagnose-recorder" target="_blank" rel="noopener sponsored nofollow"><div class="rn">Comu</div><div class="rp">基本の文字起こし・要約は無料・無制限。会話を仕事に活かすAIレコーダー。</div><div class="rc">詳しく見る →</div></a><a class="res" data-cand="zenchord" href="https://px.a8.net/svt/ejp?a8mat=4BGD73+A07CUQ+5QLS+HV7V6&a8sns=instagram&sub_id=diagnose-recorder" target="_blank" rel="noopener sponsored nofollow"><div class="rn">ZENCHORD1</div><div class="rp">オープンイヤー型・10gで耳を塞がない。会議の音声をNottaが文字起こし・要約まで。</div><div class="rc">詳しく見る →</div></a></div><p class="pr">アフィリエイト広告を含みます。</p></div>
<a class="back" href="/diagnose">← 診断の一覧へ</a>
<footer class="SITEFOOT" style="max-width:760px;margin:44px auto 0;padding:18px 20px 40px;border-top:1px solid #1F2A3A;font-size:13px;color:#94A3B8;line-height:2"><a href="/read/" style="color:#94A3B8;text-decoration:none">記事一覧</a> ／ <a href="/steps/" style="color:#94A3B8;text-decoration:none">手順まとめ</a> ／ <a href="/tools/" style="color:#94A3B8;text-decoration:none">無料ツール</a> ／ <a href="/diagnose/" style="color:#94A3B8;text-decoration:none">診断</a> ／ <a href="/about/" style="color:#94A3B8;text-decoration:none">運営者情報</a> ／ <a href="/privacy/" style="color:#94A3B8;text-decoration:none">プライバシー</a><div style="margin-top:6px">アフィリエイト広告を含みます。</div></footer></main>
<script>
const Q = [{"q": "主な用途は？", "a": [["対面の会議・商談", "offline"], ["オンライン会議", "online"]]}, {"q": "文字起こしは？", "a": [["必要", "transcribe"], ["要らない（録音だけ）", "record"]]}, {"q": "予算の考え方は？", "a": [["月額を抑えたい", "cheap"], ["精度優先", "quality"]]}];
const R = [{"when": {"offline": true, "transcribe": true}, "pick": "plaud", "why": "対面の会議を録って、あとから文字起こしする用途なら Plaud が向いています。"}, {"when": {"online": true, "transcribe": true}, "pick": "comu", "why": "オンライン会議の文字起こしと共有なら Comu が向いています。"}, {"when": {"record": true}, "pick": "zenchord", "why": "録音と聞き取りを同時に済ませたいなら、AIイヤホン型の ZenChord が向いています。"}];
const form = document.getElementById('form');
Q.forEach((q, qi) => {
  const box = document.createElement('div');
  box.className = 'q';
  const t = document.createElement('p');
  t.className = 'qt';
  t.textContent = q.q;
  box.appendChild(t);
  q.a.forEach((a, ai) => {
    const label = document.createElement('label');
    const inp = document.createElement('input');
    inp.type = 'radio';
    inp.name = 'q' + qi;
    inp.value = a[1];
    if (ai === 0) inp.checked = true;
    label.appendChild(inp);
    label.appendChild(document.createTextNode(a[0]));
    box.appendChild(label);
  });
  form.appendChild(box);
});
document.getElementById('go').addEventListener('click', () => {
  const picks = {};
  Q.forEach((q, qi) => {
    const el = document.querySelector('input[name="q' + qi + '"]:checked');
    if (el) picks[el.value] = true;
  });
  let hit = R.find(r => Object.keys(r.when).every(k => picks[k]));
  if (!hit) hit = R[R.length - 1];
  document.getElementById('why').textContent = hit.why;
  document.querySelectorAll('.res').forEach(el => {
    el.style.display = (el.dataset.cand === hit.pick) ? 'block' : 'none';
  });
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
});
</script>
</body></html>
